[project]
name = "bazaar-contrib-server-activity"
version = "0.3.0rc3"
description = "The activity of the Bazaar Compute server: what the computers report, kept once, the turns and usage it adds up to, and the pages that show them"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = [
    "bazaar-core~=0.3.0rc1",
    "bazaar-contrib-audit~=0.3.0rc20",
    "bazaar-contrib-harness~=0.3.0rc23",
    "bazaar-contrib-schema~=0.3.0rc1",
    "bazaar-contrib-storage~=0.3.0rc1",
    "bazaar-contrib-timer~=0.3.0rc1",
    "bazaar-contrib-server~=0.3.0rc6",
    "bazaar-contrib-server-access~=0.3.0rc5",
    "bazaar-contrib-server-agent~=0.3.0rc8",
    "bazaar-contrib-server-computer~=0.3.0rc3",
    "bazaar-contrib-server-database~=0.3.0rc1",
    "bazaar-contrib-server-migrations~=0.3.0rc3",
    "bazaar-contrib-server-overview~=0.3.0rc3",
    "jinja2>=3.1.6",
    "pydantic>=2.12.0",
    "starlette>=0.48.0",
]

[project.entry-points."bazaar_compute_node.contribs"]
server-activity = "bazaar_contrib_server_activity:activity"

[project.urls]
Repository = "https://github.com/open-bazaar/contrib-server-activity"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:anyio"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.15"
pythonPlatform = "All"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMatchNotExhaustive = "error"
reportUnreachable = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"

[tool.ruff.lint]
extend-select = ["ASYNC"]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "bazaar-contrib-sqlite~=0.3.0rc1",
    "bazaar-contrib-timer~=0.3.0rc26",
    "blockbuster>=1.5.29,<1.6",
    "httpx>=0.28.0,<1",
    "playwright>=1.55.0",
    "pyright==1.1.414",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]
